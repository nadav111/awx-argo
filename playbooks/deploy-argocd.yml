---
- name: Deploy Argo CD to k3s
  hosts: "127.0.0.1"
  connection: local
  gather_facts: false
  become: false

  vars:
    argocd_namespace: argocd
    argocd_chart_version: "10.14.0"
    argocd_sample_app_enabled: true
    kubeconfig: "{{ lookup('ansible.builtin.env', 'KUBECONFIG') }}"

  tasks:
    - name: Check cluster credential
      ansible.builtin.import_tasks: tasks/check.yml

    - name: Create namespace
      ansible.builtin.import_tasks: tasks/namespace.yml

    - name: Install Argo CD
      ansible.builtin.import_tasks: tasks/install.yml

    - name: Expose Argo CD on port 80
      ansible.builtin.import_tasks: tasks/ingress.yml

    - name: Connect the podinfo sample application
      ansible.builtin.import_tasks: tasks/sample-app.yml
      when: argocd_sample_app_enabled | bool

---
- name: Create the podinfo Argo CD Application
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    validate_certs: true
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: podinfo
        namespace: "{{ argocd_namespace }}"
      spec:
        project: default
        source:
          repoURL: https://github.com/stefanprodan/podinfo.git
          targetRevision: master
          path: kustomize
          kustomize:
            patches:
              - target:
                  kind: Deployment
                  name: podinfo
                patch: |
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: podinfo
                  spec:
                    template:
                      spec:
                        containers:
                          - name: podinfod
                            env:
                              - name: PODINFO_PREFIX
                                value: /podinfo
                            livenessProbe:
                              exec:
                                command:
                                  - podcli
                                  - check
                                  - http
                                  - localhost:9898/podinfo/healthz
                            readinessProbe:
                              exec:
                                command:
                                  - podcli
                                  - check
                                  - http
                                  - localhost:9898/podinfo/readyz
        destination:
          server: https://kubernetes.default.svc
          namespace: podinfo
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
          retry:
            limit: 5
            backoff:
              duration: 5s
              factor: 2
              maxDuration: 3m

- name: Ensure the podinfo namespace exists before creating its ingress
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    validate_certs: true
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: podinfo

- name: Create the podinfo HTTP ingress
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    validate_certs: true
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: podinfo
        namespace: podinfo
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: web
      spec:
        ingressClassName: traefik
        rules:
          - http:
              paths:
                - path: /podinfo
                  pathType: Prefix
                  backend:
                    service:
                      name: podinfo
                      port:
                        number: 9898
